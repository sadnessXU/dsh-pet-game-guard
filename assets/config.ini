; 宠物游戏守卫配置 —— 改完保存，右键托盘图标选「重新加载配置」即生效

; 总开关：0 = 完全停用（宠物一直显示）
enabled=1

; 检测间隔（毫秒），越小反应越快，350 足够
poll_ms=350
; 连续几次判定为「游戏中」才隐藏 / 连续几次判定「不在游戏」才显示（防闪）
hide_after=2
show_after=2

; 进了全屏应用（含全屏游戏、全屏视频）就隐藏
hide_when_fullscreen=1
; 前台是游戏程序就隐藏（覆盖窗口化运行的游戏）
hide_when_game_process=1

; 自动扫描 Steam 库目录（含 libraryfolders.vdf 里的其它盘）
scan_steam_libraries=1
; 多久重新扫一次游戏目录（分钟）
rescan_minutes=5

; 切换时写日志到 petguard.log（排查用，平时 0 就行）
debug_log=1

; 这些进程前台时一律不隐藏（逗号分隔，写 exe 名即可）
ignore_processes=explorer.exe,DeepSeek Harness.exe
; 额外的游戏目录（逗号分隔，整棵目录都当成游戏）
extra_game_dirs=
; 额外的游戏进程名（逗号分隔）
extra_game_exes=
